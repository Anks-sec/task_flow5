<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow - Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">
    <h1>TaskFlow</h1>
    <p class="subtitle">Organize your day, one task at a time.</p>

    <form id="task-form">
      <input type="text" id="task-input" placeholder="Enter a new task..." autocomplete="off" required>
      <button type="submit">Add Task</button>
    </form>

    <ul id="task-list"></ul>

    <p id="empty-message">No tasks yet. Add your first task!</p>
  </div>

  <script src="script.js"></script>
</body>

</html>
